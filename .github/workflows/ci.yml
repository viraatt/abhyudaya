name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint -- --max-warnings 100
      continue-on-error: true
    
    - name: Build project
      run: npm run build
    
    - name: Check build output
      run: |
        echo "✅ Build completed!"
        echo "📦 Build size:"
        du -sh dist/
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: buildfiles
        path: dist/
        retention-days: 7

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Serve built files
      run: npx serve -s dist -l 8080 &
    
    - name: Wait for server
      run: npx wait-on http://localhost:8080
    
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: http://localhost:8080
        uploadArtifacts: true
        temporaryPublicStorage: true
        artifactUploadDir: './lhr'
        artifactName: lighthouse_results 
