name: Abhyudaya Time Capsule Notification Scheduler

on:
  schedule:
    # Runs at 04:00 UTC (09:30 AM IST) daily
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  notify-due-capsules:
    name: Notify Due Time Capsules
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Notification Cron Endpoint
        run: |
          APP_URL="${{ secrets.PUBLIC_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://www.abhyudayaclub.in"
          fi

          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error ::CRON_SECRET secret is not configured. Cannot authenticate notification cron."
            exit 1
          fi

          echo "Triggering Time Capsule Notification Cron at $APP_URL/api/time-capsule/notify-cron..."

          HTTP_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/time-capsule/notify-cron")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error ::Cron trigger failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "Time Capsule notification scheduler executed successfully."
